[project]
name = "price_detective"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests que hacen peticiones reales a la red"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
