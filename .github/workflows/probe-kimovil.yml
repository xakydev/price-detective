name: probe-kimovil

# Prueba única de viabilidad (cambio incluir-kimovil): ¿pasa un Chromium
# estándar, sin técnicas de evasión, el desafío de Cloudflare de Kimovil desde
# la IP del runner? Una sola carga de la ficha. Solo manual.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Instalar uv
        uses: astral-sh/setup-uv@v7

      - name: Instalar Chromium de Playwright
        shell: bash
        run: uv run --no-project --with playwright python -m playwright install --with-deps chromium

      - name: Cargar la ficha con navegador visible (xvfb)
        shell: bash
        run: |
          cat > probe.py <<'PY'
          import json
          import re

          from playwright.sync_api import sync_playwright

          URL = "https://www.kimovil.com/es/donde-comprar-apple-iphone-17"
          # Desafío de Cloudflare en inglés y en español.
          CHALLENGE = re.compile(r"just a moment|attention required|un momento", re.I)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=False)
              page = browser.new_page(locale="es-ES")
              response = page.goto(URL, wait_until="domcontentloaded", timeout=30_000)
              status = response.status if response else None
              # Hasta 15 s para que un desafío automático se resuelva solo.
              for _ in range(15):
                  if not CHALLENGE.search(page.title()):
                      break
                  page.wait_for_timeout(1_000)
              title = page.title()
              html = page.content()
              browser.close()

          offer = None
          for block in re.findall(
              r'<script type="application/ld\+json">(.*?)</script>', html, re.S
          ):
              try:
                  data = json.loads(block)
              except json.JSONDecodeError:
                  continue
              items = data if isinstance(data, list) else [data]
              for item in items:
                  if isinstance(item, dict) and isinstance(item.get("offers"), dict):
                      o = item["offers"]
                      if o.get("@type") == "AggregateOffer":
                          offer = {k: o.get(k) for k in ("lowPrice", "highPrice", "priceCurrency", "offerCount")}

          challenge = bool(CHALLENGE.search(title))
          lines = [
              "## Probe Kimovil desde el runner",
              "",
              f"- Código del documento inicial: `{status}`",
              f"- Título final: {title}",
              f"- Desafío de Cloudflare al final: {'SÍ' if challenge else 'no'}",
              f"- Tamaño del HTML: {len(html)} bytes",
              f"- AggregateOffer: {offer if offer else 'NO encontrado'}",
          ]
          print("\n".join(lines))
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          if challenge or not offer:
              print("::warning title=Kimovil::Sin acceso a los datos desde el runner")
          PY
          xvfb-run -a uv run --no-project --with playwright python probe.py
